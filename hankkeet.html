<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hankkeet | Länsi-Hollolan Erämiehet ry</title>

    <meta name="description"
          content="Länsi-Hollolan Erämiehet ry:n hankkeet ja kehittämistoimenpiteet.">

    <link rel="icon" href="Logo.png">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f0e6;
            color: #2f3b24;
        }

        header {
            background: linear-gradient(rgba(47,59,36,.75), rgba(47,59,36,.75)), #556b2f;
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        .logo {
            display: block;
            width: 160px;
            max-width: 45vw;
            height: auto;
            margin: 0 auto 20px;
        }

        nav {
            background: #6b4f2a;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        section {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .eu-logo {
            max-width: 500px;
            width: 100%;
            display: block;
            margin: 20px auto;
        }

        footer {
            background: #2f3b24;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .funding-box {
            background: #eef5ea;
            border-left: 5px solid #556b2f;
            padding: 15px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            nav a {
                display: block;
                padding: 8px 0;
            }
        }

        .cookie-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.58);
        }

        .cookie-overlay[hidden] {
            display: none;
        }

        .cookie-dialog {
            width: min(760px,100%);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: #fff;
            color: #26301e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 12px 45px rgba(0,0,0,.35);
        }

        .cookie-dialog h2 {
            margin-top: 0;
        }

        .cookie-category {
            margin: 12px 0;
            padding: 14px;
            background: #f4f0e6;
            border: 1px solid #c9cfc0;
            border-radius: 8px;
        }

        .cookie-category-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
